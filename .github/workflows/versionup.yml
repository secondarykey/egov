name: VersionUp

on:
  pull_request:
    branches: [ "main" ]
    types: [ closed ]

env:

  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:

  versionup:

    if: |
      github.event.pull_request.merged == true &&
      !startsWith(github.event.pull_request.title, 'chore: version')

    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:

      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.MY_GITHUB_TOKEN }}

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev \
            libwebkitgtk-6.0-dev

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26'

      - name: Determine Wails3 CLI version
        working-directory: ./_cmd/egov
        run: |
          WAILS_VERSION=$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v3)
          echo "WAILS_VERSION=$WAILS_VERSION" >> $GITHUB_ENV

      - name: Install Wails3
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}

      - name: Determine and Bump Version
        id: versioning
        run: |

          BASE_VERSION=$(cat _cmd/egov/version | xargs)
          if ! git rev-parse "v$BASE_VERSION" >/dev/null 2>&1; then
            FINAL_VERSION="$BASE_VERSION"
          else
            PREFIX=${BASE_VERSION%.*}
            PATCH=${BASE_VERSION##*.}
            NEXT_PATCH=$((PATCH + 1))
            FINAL_VERSION="${PREFIX}.${NEXT_PATCH}"
          fi

          go run ./_cmd/version $FINAL_VERSION

          echo "NEW_VERSION=$FINAL_VERSION" >> $GITHUB_ENV

      - name: Update Build Assets
        run: |
          cd _cmd/egov
          # -name/-binaryname は config.yml から読まれないため必ず指定する。
          # 省略すると INFO_PROJECTNAME / CFBundleExecutable / nfpm name / desktop Exec が空になる。
          wails3 update build-assets -name "egov" -binaryname "egov" -config build/config.yml -dir build
          # wails3 update build-assets は build/Taskfile.yml をテンプレートで上書きし、
          # install:frontend:deps の status チェック等のローカル修正を破壊するため元に戻す。
          # （バージョン情報は Taskfile.yml には含まれないので巻き戻しても問題ない）
          git checkout -- build/Taskfile.yml

      - name: Commit and Pull Request
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          BRANCH="chore/version-${{env.NEW_VERSION}}"

          git checkout -b $BRANCH
          git add .
          git commit -m "chore: version ${{env.NEW_VERSION}}"
          git push origin $BRANCH

          gh pr create \
            --title "chore: version ${{env.NEW_VERSION}}" \
            --body "Auto version bump to ${{env.NEW_VERSION}}" \
            --base main \
            --head $BRANCH

          gh pr merge $BRANCH --merge --delete-branch
        env:
          GH_TOKEN: ${{ secrets.MY_GITHUB_TOKEN }}

      - name: Tag
        run: |
          NEW_TAG="v${{env.NEW_VERSION}}"
          git tag $NEW_TAG
          git push origin $NEW_TAG
