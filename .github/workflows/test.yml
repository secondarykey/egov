name: Test

# PR ごとにテストとビルドが通るかを確かめる。
# -race は Windows の手元環境では動かないことがあるため、ここで確認する。
on:
  pull_request:
  push:
    branches: [ "main", "features" ]

jobs:

  test:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev \
            libwebkitgtk-6.0-dev

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.27'

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Go vet
        run: go vet ./...

      - name: Go test
        run: go test -race ./...

      - name: Load variables
        shell: bash
        run: cat .github/variables >> $GITHUB_ENV

      - name: Install Wails CLI
        # .github/variables でピン留めしたバージョンを使う（@latest は使わない）
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}

      - name: Build
        # bindings の生成・フロントのビルド・Go のビルドまでをまとめて確かめる
        working-directory: ./_cmd/egov
        run: wails3 build
